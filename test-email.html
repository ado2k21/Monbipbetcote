<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Email</title>
</head>
<body>
  <h2>Test Resend</h2>

  <input id="email" type="email" placeholder="Ton adresse email">
  <button onclick="sendTestEmail()">Envoyer le test</button>

  <p id="result"></p>

  <script>
    async function sendTestEmail() {
      const email = document.getElementById("email").value;
      const result = document.getElementById("result");

      if (!email) {
        result.textContent = "Entre ton adresse email.";
        return;
      }

      result.textContent = "Envoi en cours...";

      try {
        const response = await fetch("/.netlify/functions/send-email", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            to: email,
            subject: "Test VIPBETCOTE",
            html: "<h1>Test réussi 🎉</h1><p>Resend fonctionne avec Netlify.</p>"
          })
        });

        const data = await response.json();

        if (response.ok) {
          result.textContent = "Email envoyé avec succès !";
        } else {
          result.textContent = "Erreur : " + JSON.stringify(data);
        }
      } catch (error) {
        result.textContent = "Erreur réseau : " + error.message;
      }
    }
  </script>
</body>
</html>
